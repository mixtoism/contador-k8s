name: despliegue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # En el runner, podman rootful: el rootless no tiene el cgroup cpuset delegado.
  MOTOR: sudo podman
  TF_IN_AUTOMATION: "1"

jobs:
  validar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Sintaxis de la app y los scripts
        run: |
          for f in app/*.js; do node --check "$f"; done
          sh -n app/run.sh
          bash -n scripts/*.sh
      - name: terraform fmt
        run: scripts/tf.sh kube fmt -check -diff -recursive
      - name: terraform validate (local y aws)
        run: |
          scripts/tf.sh kube init -input=false -backend=false
          scripts/tf.sh kube validate -no-color
          scripts/tf.sh aws init -input=false -backend=false
          scripts/tf.sh aws validate -no-color
      - name: helm lint
        run: |
          for e in dev prod; do
            scripts/helm.sh lint helm/contador -f "helm/contador/values-$e.yaml"
          done
      - name: kustomize build
        run: |
          for e in dev prod; do kubectl kustomize "k8s/$e" > /dev/null && echo "k8s/$e ok"; done

  aws-mock:
    needs: validar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: terraform test con AWS simulado
        run: |
          scripts/tf.sh aws init -input=false
          scripts/tf.sh aws test -no-color | tee salida.txt
          { echo "## AWS (mock)"; echo '```'; grep -E 'run "|Success|Failure' salida.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  terraform:
    needs: validar
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - entorno: dev-kube
            ns: contador-dev
            puerto: 8080
          - entorno: prod-kube
            ns: contador-prod
            puerto: 8081
    env:
      E: ${{ matrix.entorno }}
      NS: ${{ matrix.ns }}
      URL: http://localhost:${{ matrix.puerto }}
    steps:
      - uses: actions/checkout@v4

      - name: Crear clúster k3s
        run: scripts/cluster.sh crear

      - name: Construir y cargar la imagen (v1 y v2)
        run: |
          scripts/cluster.sh cargar v1
          scripts/cluster.sh cargar v2

      - name: terraform init
        run: scripts/tf.sh "$E" init -input=false

      - name: "Fase 1: instalar"
        run: |
          fase() {  # fase <título> <args de terraform...>
            local titulo=$1; shift
            scripts/tf.sh "$E" "$@" -auto-approve -input=false -no-color | tee salida.txt
            { echo "### $titulo"; echo '```'; grep -E '^(Plan:|No changes|Destroy complete)' salida.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          }
          declare -f fase > fase.sh
          echo "## Terraform · \`$E\`" >> "$GITHUB_STEP_SUMMARY"
          fase "1 · Instalar" apply -var imagen=localhost/contador:v1
          scripts/probar.sh "$URL" 30 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: "Fase 2: actualizar a v2 (rolling update)"
        run: |
          source fase.sh
          fase "2 · Actualizar" apply -var imagen=localhost/contador:v2 -var version_app=v2
          scripts/probar.sh "$URL" 30 | tee -a "$GITHUB_STEP_SUMMARY"
          curl -fs "$URL/api" | jq -e '.version == "v2"'

      - name: "Fase 3: escalar a 5 réplicas"
        run: |
          source fase.sh
          fase "3 · Escalar" apply -var imagen=localhost/contador:v2 -var version_app=v2 -var replicas=5
          # El apply vuelve antes de que los pods nuevos estén listos: esperar a los 5.
          $MOTOR exec contador-k3s kubectl -n "$NS" rollout status deployment/contador --timeout=2m
          scripts/probar.sh "$URL" 50 | tee -a "$GITHUB_STEP_SUMMARY"
          test "$(curl -fs "$URL/stats" | jq '.pods | length')" -ge 5

      - name: "Extra: Terraform detecta un cambio hecho a mano (drift)"
        run: |
          $MOTOR exec contador-k3s kubectl -n "$NS" scale deployment/contador --replicas=1
          set +e
          scripts/tf.sh "$E" plan -detailed-exitcode -input=false -no-color \
            -var imagen=localhost/contador:v2 -var version_app=v2 -var replicas=5 | tee salida.txt
          codigo=${PIPESTATUS[0]}
          set -e
          { echo "### Drift (kubectl scale a 1)"; echo '```'; grep -E 'replicas|^Plan:' salida.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          test "$codigo" -eq 2   # 2 = hay diferencias

      - name: "Fase 4: eliminar"
        run: |
          source fase.sh
          fase "4 · Eliminar" destroy
          ! $MOTOR exec contador-k3s kubectl get namespace "$NS"

      - name: Estado del clúster si algo falla
        if: failure()
        run: scripts/diagnostico.sh

      - name: Borrar clúster
        if: always()
        run: scripts/cluster.sh borrar

  alternativas:
    needs: validar
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        via: [yaml, helm]
    env:
      VIA: ${{ matrix.via }}
    steps:
      - uses: actions/checkout@v4

      - name: Crear clúster y cargar la imagen
        run: |
          scripts/cluster.sh crear
          scripts/cluster.sh cargar v1
          scripts/cluster.sh cargar v2

      - name: Instalar dev y prod
        run: |
          make "$VIA-dev" "$VIA-prod"
          if [ "$VIA" = helm ]; then
            for e in dev prod; do scripts/helm.sh test contador -n "contador-helm-$e"; done
          fi

      - name: Probar
        run: |
          if [ "$VIA" = yaml ]; then puertos="8082 8083"; else puertos="8084 8085"; fi
          for p in $puertos; do
            echo "## $VIA · localhost:$p" >> "$GITHUB_STEP_SUMMARY"
            scripts/probar.sh "http://localhost:$p" 30 | tee -a "$GITHUB_STEP_SUMMARY"
          done

      - name: Actualizar prod a v2 (sólo helm)
        if: matrix.via == 'helm'
        run: |
          make helm-prod TAG=v2
          scripts/helm.sh history contador -n contador-helm-prod | tee -a "$GITHUB_STEP_SUMMARY"
          curl -fs http://localhost:8085/api | jq -e '.version == "v2"'

      - name: Desinstalar
        run: make "quitar-$VIA-dev" "quitar-$VIA-prod"

      - name: Estado del clúster si algo falla
        if: failure()
        run: scripts/diagnostico.sh

      - name: Borrar clúster
        if: always()
        run: scripts/cluster.sh borrar
