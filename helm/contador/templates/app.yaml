apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "contador.etiquetas" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: { app: {{ .Release.Name }} }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        {{- include "contador.etiquetas" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: contador
          image: "{{ .Values.imagen.repositorio }}:{{ include "contador.version" . }}"
          imagePullPolicy: {{ .Values.imagen.pullPolicy }}
          env:
            - { name: ENTORNO, value: {{ .Values.entorno | quote }} }
            - { name: APP_VERSION, value: {{ include "contador.version" . | quote }} }
            - { name: REDIS_HOST, value: {{ .Release.Name }}-redis }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Release.Name }}-redis, key: password }
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 3
          resources: {{- toYaml .Values.recursos | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "contador.etiquetas" . | nindent 4 }}
spec:
  type: {{ .Values.servicio.tipo }}
  selector: { app: {{ .Release.Name }} }
  ports:
    - port: 80
      targetPort: 8080
      {{- with .Values.servicio.nodePort }}
      nodePort: {{ . }}
      {{- end }}
