{{- /* La contraseña se genera una vez y se reutiliza en cada upgrade. */ -}}
{{- $nombre := printf "%s-redis" .Release.Name -}}
{{- $existente := lookup "v1" "Secret" .Release.Namespace $nombre -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $nombre }}
  labels: {{- include "contador.etiquetas" . | nindent 4 }}
data:
  password: {{ if $existente }}{{ index $existente.data "password" }}{{ else }}{{ randAlphaNum 24 | b64enc }}{{ end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $nombre }}
  labels: {{- include "contador.etiquetas" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ $nombre }} }
  template:
    metadata:
      labels:
        app: {{ $nombre }}
        {{- include "contador.etiquetas" . | nindent 8 }}
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.imagen }}
          args: ["--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $nombre }}, key: password }
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket: { port: 6379 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $nombre }}
  labels: {{- include "contador.etiquetas" . | nindent 4 }}
spec:
  selector: { app: {{ $nombre }} }
  ports:
    - port: 6379
