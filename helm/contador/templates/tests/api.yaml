# helm test <release>: comprueba desde dentro del clúster que la API responde.
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: "{{ .Values.imagen.repositorio }}:{{ include "contador.version" . }}"
      imagePullPolicy: {{ .Values.imagen.pullPolicy }}
      command:
        - node
        - -e
        - |
          (async () => {
            for (let i = 1; i <= 15; i++) {
              try {
                const j = await (await fetch("http://{{ .Release.Name }}/api")).json();
                console.log(j);
                if (j.visitas > 0) process.exit(0);
              } catch (e) { console.error(`intento ${i}: ${e.cause?.code || e.message}`); }
              await new Promise(r => setTimeout(r, 2000));
            }
            process.exit(1);
          })();
