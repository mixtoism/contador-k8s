# helm test <release>: comprueba desde dentro del clúster que la API responde.
apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: "{{ .Values.imagen.repositorio }}:{{ include "contador.version" . }}"
      imagePullPolicy: {{ .Values.imagen.pullPolicy }}
      command:
        - node
        - -e
        - |
          fetch("http://{{ .Release.Name }}/api")
            .then(r => r.json())
            .then(j => { console.log(j); process.exit(j.visitas > 0 ? 0 : 1); })
            .catch(e => { console.error(e); process.exit(1); });
