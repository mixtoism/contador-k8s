apiVersion: apps/v1
kind: Deployment
metadata:
  name: contador
spec:
  replicas: 1
  selector:
    matchLabels: { app: contador }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: contador }
    spec:
      terminationGracePeriodSeconds: 10
      # Sin esto, un Service "redis" mete REDIS_PORT=tcp://… en el pod y pisa la nuestra.
      enableServiceLinks: false
      containers:
        - name: contador
          image: localhost/contador:v1
          imagePullPolicy: IfNotPresent
          env:
            - { name: ENTORNO, value: base }
            - { name: APP_VERSION, value: v1 }
            - { name: REDIS_HOST, value: redis }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: redis, key: password }
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            periodSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: contador
spec:
  type: NodePort
  selector: { app: contador }
  ports:
    - port: 80
      targetPort: 8080
