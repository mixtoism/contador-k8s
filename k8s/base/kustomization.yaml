# Manifiestos "a pelo". Cada entorno (k8s/dev, k8s/prod) los parchea con kustomize:
#   kubectl apply -k k8s/dev        kubectl kustomize k8s/prod   (ver el YAML final)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: contador
      app.kubernetes.io/managed-by: kubectl
resources:
  - redis.yaml
  - app.yaml
