apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: contador-yaml-dev
resources:
  - namespace.yaml
  - ../base
images:
  - name: localhost/contador
    newTag: v1
replicas:
  - name: contador
    count: 1
# Sólo para la demo: en un proyecto real la contraseña no va en el repo.
secretGenerator:
  - name: redis
    literals:
      - password=demo-dev-no-usar-en-serio
patches:
  - target: { kind: Service, name: contador }
    patch: |
      - op: add
        path: /spec/ports/0/nodePort
        value: 30082   # → http://localhost:8082
  - target: { kind: Deployment, name: contador }
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: yaml-dev
